<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0f172a" />
			<stop offset="100%" stop-color="#1e293b" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#22c55e" />
			<stop offset="100%" stop-color="#3b82f6" />
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="3" result="b" />
			<feMerge>
				<feMergeNode in="b" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>
	
	<!-- Background -->
	<rect width="100%" height="100%" rx="16" fill="url(#bg)" />
	
	<!-- Phone frame -->
	<rect x="50" y="20" width="300" height="260" rx="20" fill="#1f2937" stroke="#374151" stroke-width="2" />
	<rect x="60" y="30" width="280" height="240" rx="12" fill="#111827" />
	
	<!-- Status bar -->
	<rect x="60" y="30" width="280" height="20" fill="#1f2937" />
	<circle cx="75" cy="40" r="2" fill="#22c55e" />
	<text x="200" y="42" text-anchor="middle" font-family="system-ui" font-size="8" fill="#9ca3af">9:41</text>
	<rect x="320" y="35" width="15" height="8" rx="2" fill="#22c55e" />
	
	<!-- App header -->
	<rect x="60" y="50" width="280" height="40" fill="#1f2937" />
	<text x="200" y="75" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#e5e7eb">AI Form Coach</text>
	
	<!-- Camera view -->
	<rect x="80" y="100" width="240" height="120" rx="8" fill="#0f172a" stroke="url(#accent)" stroke-width="2" />
	
	<!-- Pose skeleton -->
	<g stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
		<line x1="200" y1="120" x2="220" y2="160" />
		<line x1="220" y1="160" x2="240" y2="190" />
		<line x1="200" y1="120" x2="240" y2="130" />
		<line x1="240" y1="130" x2="280" y2="160" />
		<line x1="240" y1="130" x2="240" y2="180" />
		<line x1="240" y1="180" x2="220" y2="210" />
		<line x1="240" y1="180" x2="260" y2="210" />
	</g>
	
	<!-- Pose points -->
	<g fill="url(#accent)">
		<circle cx="200" cy="120" r="4" />
		<circle cx="220" cy="160" r="4" />
		<circle cx="240" cy="190" r="4" />
		<circle cx="240" cy="130" r="4" />
		<circle cx="280" cy="160" r="4" />
		<circle cx="240" cy="180" r="4" />
		<circle cx="220" cy="210" r="4" />
		<circle cx="260" cy="210" r="4" />
	</g>
	
	<!-- HUD overlay -->
	<rect x="80" y="100" width="100" height="60" rx="6" fill="#00000080" />
	<text x="130" y="120" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="700" fill="#22c55e">12</text>
	<text x="130" y="135" text-anchor="middle" font-family="system-ui" font-size="10" fill="#9ca3af">reps</text>
	<rect x="90" y="145" width="80" height="6" rx="3" fill="#374151" />
	<rect x="90" y="145" width="60" height="6" rx="3" fill="#22c55e" />
	
	<!-- Bottom controls -->
	<rect x="80" y="230" width="240" height="30" rx="6" fill="#1f2937" />
	<circle cx="120" cy="245" r="8" fill="#ef4444" />
	<circle cx="200" cy="245" r="12" fill="#22c55e" />
	<circle cx="280" cy="245" r="8" fill="#6b7280" />
</svg>
