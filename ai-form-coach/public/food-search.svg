<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#fefce8" />
			<stop offset="100%" stop-color="#fef3c7" />
		</linearGradient>
		<linearGradient id="search" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#3b82f6" />
			<stop offset="100%" stop-color="#1d4ed8" />
		</linearGradient>
	</defs>
	
	<!-- Background -->
	<rect width="100%" height="100%" rx="16" fill="url(#bg)" />
	
	<!-- Header -->
	<rect x="20" y="20" width="360" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb" />
	<text x="200" y="45" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">🍎 Food Search</text>
	
	<!-- Search bar -->
	<rect x="40" y="80" width="320" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" />
	<circle cx="60" cy="100" r="8" fill="none" stroke="#9ca3af" stroke-width="2" />
	<line x1="65" y1="105" x2="70" y2="110" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
	<text x="80" y="105" font-family="system-ui" font-size="14" fill="#9ca3af">Search for foods...</text>
	
	<!-- Search results -->
	<g transform="translate(40, 140)">
		<!-- Result 1 -->
		<rect x="0" y="0" width="320" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" />
		<text x="15" y="25" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">🍗 Grilled Chicken Breast</text>
		<text x="15" y="35" font-family="system-ui" font-size="12" fill="#6b7280">165 cal per 100g</text>
		<circle cx="300" cy="20" r="6" fill="#22c55e" />
		
		<!-- Result 2 -->
		<rect x="0" y="50" width="320" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" />
		<text x="15" y="75" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">🍚 Brown Rice</text>
		<text x="15" y="85" font-family="system-ui" font-size="12" fill="#6b7280">111 cal per 100g</text>
		<circle cx="300" cy="70" r="6" fill="#22c55e" />
		
		<!-- Result 3 -->
		<rect x="0" y="100" width="320" height="40" rx="6" fill="#ffffff" stroke="#e5e7eb" />
		<text x="15" y="125" font-family="system-ui" font-size="14" font-weight="600" fill="#111827">🥑 Avocado</text>
		<text x="15" y="135" font-family="system-ui" font-size="12" fill="#6b7280">160 cal per 100g</text>
		<circle cx="300" cy="120" r="6" fill="#22c55e" />
	</g>
	
	<!-- Quick add button -->
	<rect x="40" y="240" width="320" height="40" rx="8" fill="url(#search)" />
	<text x="200" y="265" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="600" fill="#ffffff">⚡ Quick Add to Breakfast</text>
</svg>
