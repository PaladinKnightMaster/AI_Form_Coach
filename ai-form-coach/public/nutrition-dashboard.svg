<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#f0fdf4" />
			<stop offset="100%" stop-color="#ecfdf5" />
		</linearGradient>
		<linearGradient id="calories" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#3b82f6" />
			<stop offset="100%" stop-color="#1d4ed8" />
		</linearGradient>
		<linearGradient id="protein" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#ef4444" />
			<stop offset="100%" stop-color="#dc2626" />
		</linearGradient>
		<linearGradient id="carbs" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#22c55e" />
			<stop offset="100%" stop-color="#16a34a" />
		</linearGradient>
		<linearGradient id="fat" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#eab308" />
			<stop offset="100%" stop-color="#ca8a04" />
		</linearGradient>
	</defs>
	
	<!-- Background -->
	<rect width="100%" height="100%" rx="16" fill="url(#bg)" />
	
	<!-- Header -->
	<rect x="20" y="20" width="360" height="40" rx="8" fill="#ffffff" stroke="#e5e7eb" />
	<text x="200" y="45" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#111827">Today's Nutrition</text>
	
	<!-- Macro rings -->
	<g transform="translate(200, 120)">
		<!-- Calories ring -->
		<circle cx="0" cy="0" r="35" fill="none" stroke="#e5e7eb" stroke-width="6" />
		<circle cx="0" cy="0" r="35" fill="none" stroke="url(#calories)" stroke-width="6" stroke-dasharray="220" stroke-dashoffset="44" stroke-linecap="round" />
		<text x="0" y="-5" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#3b82f6">1,847</text>
		<text x="0" y="10" text-anchor="middle" font-family="system-ui" font-size="10" fill="#6b7280">cal</text>
	</g>
	
	<!-- Protein ring -->
	<g transform="translate(100, 120)">
		<circle cx="0" cy="0" r="25" fill="none" stroke="#e5e7eb" stroke-width="4" />
		<circle cx="0" cy="0" r="25" fill="none" stroke="url(#protein)" stroke-width="4" stroke-dasharray="157" stroke-dashoffset="31" stroke-linecap="round" />
		<text x="0" y="-3" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#ef4444">142g</text>
		<text x="0" y="8" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6b7280">protein</text>
	</g>
	
	<!-- Carbs ring -->
	<g transform="translate(300, 120)">
		<circle cx="0" cy="0" r="25" fill="none" stroke="#e5e7eb" stroke-width="4" />
		<circle cx="0" cy="0" r="25" fill="none" stroke="url(#carbs)" stroke-width="4" stroke-dasharray="157" stroke-dashoffset="47" stroke-linecap="round" />
		<text x="0" y="-3" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#22c55e">198g</text>
		<text x="0" y="8" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6b7280">carbs</text>
	</g>
	
	<!-- Fat ring -->
	<g transform="translate(200, 200)">
		<circle cx="0" cy="0" r="25" fill="none" stroke="#e5e7eb" stroke-width="4" />
		<circle cx="0" cy="0" r="25" fill="none" stroke="url(#fat)" stroke-width="4" stroke-dasharray="157" stroke-dashoffset="78" stroke-linecap="round" />
		<text x="0" y="-3" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="700" fill="#eab308">58g</text>
		<text x="0" y="8" text-anchor="middle" font-family="system-ui" font-size="8" fill="#6b7280">fat</text>
	</g>
	
	<!-- Meal list -->
	<g transform="translate(20, 250)">
		<rect x="0" y="0" width="360" height="30" rx="6" fill="#ffffff" stroke="#e5e7eb" />
		<text x="10" y="20" font-family="system-ui" font-size="12" fill="#111827">🌅 Breakfast: 487 cal</text>
		<text x="200" y="20" font-family="system-ui" font-size="12" fill="#111827">☀️ Lunch: 623 cal</text>
		<text x="300" y="20" font-family="system-ui" font-size="12" fill="#111827">🌙 Dinner: 737 cal</text>
	</g>
</svg>
