<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0b1220" />
			<stop offset="100%" stop-color="#0c1729" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#22c55e" />
			<stop offset="100%" stop-color="#3b82f6" />
		</linearGradient>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="4" result="b" />
			<feMerge>
				<feMergeNode in="b" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>
	<rect width="100%" height="100%" rx="16" fill="url(#bg)" />
	<!-- window top bar -->
	<rect x="0" y="0" width="800" height="40" fill="#0f1b2f" />
	<circle cx="24" cy="20" r="6" fill="#ef4444" />
	<circle cx="44" cy="20" r="6" fill="#f59e0b" />
	<circle cx="64" cy="20" r="6" fill="#22c55e" />

	<!-- pose skeleton (abstract) -->
	<g stroke="url(#accent)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
		<line x1="440" y1="150" x2="470" y2="210" />
		<line x1="470" y1="210" x2="510" y2="260" />
		<line x1="440" y1="150" x2="500" y2="160" />
		<line x1="500" y1="160" x2="560" y2="210" />
		<line x1="500" y1="160" x2="500" y2="230" />
		<line x1="500" y1="230" x2="470" y2="300" />
		<line x1="500" y1="230" x2="540" y2="300" />
	</g>
	<g fill="#3b82f6">
		<circle cx="440" cy="150" r="6" />
		<circle cx="470" cy="210" r="6" />
		<circle cx="510" cy="260" r="6" />
		<circle cx="500" cy="160" r="6" />
		<circle cx="560" cy="210" r="6" />
		<circle cx="500" cy="230" r="6" />
		<circle cx="470" cy="300" r="6" />
		<circle cx="540" cy="300" r="6" />
	</g>

	<!-- HUD card -->
	<g transform="translate(48,72)">
		<rect width="220" height="130" rx="12" fill="#ffffff11" stroke="#ffffff22" />
		<text x="16" y="50" font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="56" fill="#e5e7eb" font-weight="700">12</text>
		<text x="16" y="80" font-family="system-ui, -apple-system, Segoe UI, Roboto" font-size="14" fill="#9ca3af">reps</text>
		<rect x="16" y="98" width="188" height="12" rx="6" fill="#1f2937" />
		<rect x="16" y="98" width="128" height="12" rx="6" fill="#22c55e" />
	</g>

	<!-- sparkline -->
	<path d="M60,400 C140,360 180,420 240,390 C300,360 360,420 420,380 C480,340 560,420 620,390 C680,360 740,410 760,400" stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.7" />
</svg> 